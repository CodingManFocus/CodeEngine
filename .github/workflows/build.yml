name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeengine-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      releaseTag: ${{ steps.releaseMeta.outputs.releaseTag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release tag
        id: releaseMeta
        shell: bash
        run: |
          commitTimestamp=$(git show -s --format=%ct "$GITHUB_SHA")
          releaseDate=$(TZ=Asia/Seoul date --date="@$commitTimestamp" +%Y-%m-%d)
          printf 'releaseTag=%s-%s\n' "$releaseDate" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: Set up Node.js for Studio
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codeengine-webide/package-lock.json

      - name: Build and run tests
        run: ./gradlew --no-daemon --stacktrace build

      - name: Install browser for Studio tests
        working-directory: codeengine-webide
        run: npx playwright install --with-deps chromium

      - name: Verify Studio in browser
        working-directory: codeengine-webide
        run: npm run test:browser

      - name: Prepare build download
        shell: bash
        run: |
          mkdir -p build/artifacts
          for jarPath in codeengine-plugin/build/libs/*.jar codeengine-api/build/libs/*.jar; do
            case "$jarPath" in
              *-sources.jar) continue ;;
            esac
            cp "$jarPath" build/artifacts/
          done
          cp LICENSE.md THIRD_PARTY_NOTICES.md README.md build/artifacts/
          cp codeengine-webide/dist/THIRD_PARTY_LICENSES.txt build/artifacts/
          git archive --format=zip --output=build/artifacts/codeengine-source.zip HEAD
          cd build/artifacts
          sha256sum *.jar codeengine-source.zip > SHA256SUMS

      - name: Upload plugin, API and source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeengine-build-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeengine-test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish date-commit release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeengine-build-${{ github.run_number }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.releaseTag }}
        run: bash .github/scripts/publish-release.sh release-assets
